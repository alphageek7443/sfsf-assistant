Authentication=OAuth2JWTBearer
Description=
Name=sfsf-assistant-auth
ProxyType=Internet
Type=HTTP
URL=https\://<your-app>.cfapps.<region>.hana.ondemand.com
apptoapp=true
clientId=<ias-client-id>
clientSecret=<ias-client-secret>
tokenService.addClientCredentialsInBody=false
tokenService.body.client_id=<ias-client-id>
